[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docpilot-ai"
version = "0.2.12"
description = "AI-powered local-first CLI that converts documents into clean, structured, AI-ready Markdown"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Anuj Paroha", email = "dev.77anuj77@gmail.com" }]
keywords = ["markdown", "document-conversion", "pdf", "docx", "pptx", "ai", "cli", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.5",
    "openai>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "PyMuPDF>=1.23",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "beautifulsoup4>=4.12",
    "pytesseract>=0.3.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
parsedoc = "parsedoc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/parsedoc"]
exclude = ["**/proofs/*.mp4"]

[tool.hatch.build.targets.sdist]
include = [
    "src/parsedoc",
    "parsedoc.png",
    "setup.md",
    "README.md",
    "LICENSE",
]
exclude = ["**/proofs/*.mp4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
